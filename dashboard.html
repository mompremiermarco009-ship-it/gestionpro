<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tableau de bord - GestionPro</title>
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="manifest" href="/site.webmanifest">
</head>
<body>

<div id="loadingScreen" class="loading-overlay">
  <div class="loading-spinner"></div>
</div>

<!-- BANDEAU D'INSTALLATION APK -->
<div id="installBanner" class="install-banner hidden">
  <div class="install-text">
    <i data-lucide="smartphone" style="width: 20px; height: 20px; color: var(--green);"></i>
    <span>Installez l'application GestionPro pour un accès plus rapide.</span>
  </div>
  <div class="install-actions">
    <a href="./GestionPro.apk" download class="btn btn-primary btn-sm">Télécharger l'APK</a>
    <button id="closeBanner" class="btn-close" aria-label="Fermer"><i data-lucide="x" style="width: 18px; height: 18px;"></i></button>
  </div>
</div>

<!-- BARRE D'ANNONCE ADMIN -->
<div id="adminAnnouncementBar" class="announcement-bar hidden">
  <div style="display:flex; align-items:center; gap:0.5rem;">
    <i data-lucide="megaphone" style="width:18px;height:18px;"></i>
    <span id="announcementText">Bienvenue sur GestionPro !</span>
  </div>
  <button id="closeAnnouncement" style="background:none;border:none;color:white;cursor:pointer;"><i data-lucide="x" style="width:16px;height:16px;"></i></button>
</div>

<div id="appScreen" class="app-screen hidden">
  <header class="topbar no-print">
    <div class="topbar-inner">
      <div class="brand">
        <img src="./android-chrome-192x192.png" alt="Logo" style="width: 32px; border-radius: 8px;">
        <div><strong>GestionPro</strong><small id="companyName">Chargement...</small></div>
      </div>
      <div class="topbar-actions">
        <small id="userEmail" style="color:var(--muted);font-size:.8rem"></small>
        <button class="icon-btn" id="themeToggle"><i data-lucide="moon"></i></button>
        <button class="icon-btn" id="logoutBtn"><i data-lucide="log-out"></i></button>
      </div>
    </div>
    <nav class="tabbar">
      <button class="tab active" data-view="dashboard"><i data-lucide="layout-dashboard"></i> Tableau de bord</button>
      <button class="tab" data-view="vente"><i data-lucide="shopping-cart"></i> Vente</button>
      <button class="tab" data-view="depense"><i data-lucide="arrow-up-right"></i> Dépense</button>
      <button class="tab" data-view="stock"><i data-lucide="package"></i> Stock <span class="badge-alert hidden" id="stockBadge">0</span></button>
      <button class="tab" data-view="rentabilite"><i data-lucide="award"></i> Rentabilité</button>
      <button class="tab" data-view="tendances"><i data-lucide="line-chart"></i> Tendances</button>
      <button class="tab" data-view="historique"><i data-lucide="history"></i> Historique</button>
      <button class="tab" data-view="rapports"><i data-lucide="bar-chart-2"></i> Rapports</button>
      <button class="tab" data-view="parametres"><i data-lucide="settings"></i> Paramètres</button>
    </nav>
  </header>

  <main id="contenu">
    <!-- (Copiez-collez ici toutes les sections <section class="view" ...> de votre ancien dashboard.html. Ne changez rien, elles sont correctes). -->
    <!-- ... -->
  </main>

  <footer class="footer no-print">
    <p>© 2026 GestionPro - Tous droits réservés.</p>
  </footer>
</div>

<!-- (Copiez-collez ici toutes les modales <div class="modal-backdrop" ...> et le <div id="pdfReport"> ... de votre ancien dashboard.html). -->
<!-- ... -->

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="supabase-client.js"></script>
<script src="app.js"></script>
<script>
  // Activation du Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(console.error);
    });
  }
</script>
</body>
</html>
